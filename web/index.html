<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Notes</title>
  <style>
    :root { color-scheme: dark; }
    body {
      max-width: 760px;
      margin: 40px auto;
      padding: 0 20px;
      background: #111827;
      color: #e5e7eb;
      font: 16px system-ui, sans-serif;
    }
    input, textarea, button {
      box-sizing: border-box;
      margin: 4px;
      padding: 9px;
      border: 1px solid #374151;
      border-radius: 5px;
      background: #1f2937;
      color: #e5e7eb;
    }
    input, textarea { width: 100%; }
    textarea { min-height: 90px; resize: vertical; }
    button { cursor: pointer; }
    button:hover { background: #374151; }
    h1, h2 { color: #93c5fd; }
    pre {
      min-height: 80px;
      padding: 14px;
      overflow: auto;
      background: #030712;
      border: 1px solid #374151;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>Cloud Notes</h1>

  <h2>Notes</h2>
  <input id="note-id" placeholder="note id">
  <input id="note-title" placeholder="title">
  <textarea id="note-content" placeholder="content"></textarea>
  <br>
  <button id="create-note">Create</button>
  <button id="list-notes">List</button>
  <button id="get-note">Get one</button>
  <button id="update-note">Update</button>
  <button id="delete-note">Delete</button>

  <h2>Files</h2>
  <input id="file" type="file">
  <button id="upload-file">Upload</button>
  <button id="list-files">List</button>

  <pre id="output"></pre>

  <script src="/app.js"></script>
</body>
</html>
