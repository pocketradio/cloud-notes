<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Notes</title>
  <style>
    :root { color-scheme: dark; }
    body {
      max-width: 760px;
      margin: 40px auto;
      padding: 0 20px;
      background: #000;
      color: #e5e7eb;
      font: 16px system-ui, sans-serif;
    }
    .panel {
      margin: 16px 0;
      padding: 18px;
      border: 1px solid #262626;
      border-radius: 8px;
      background: #0b0b0b;
    }
    input, textarea, button {
      box-sizing: border-box;
      margin: 4px;
      padding: 9px;
      border: 1px solid #333;
      border-radius: 5px;
      background: #151515;
      color: #e5e7eb;
    }
    input, textarea { width: 100%; }
    textarea { min-height: 80px; resize: vertical; }
    button { cursor: pointer; }
    button:hover { background: #262626; }
    h1 { color: #93c5fd; }
    h2 { margin-top: 0; color: #93c5fd; }
    pre {
      min-height: 80px;
      padding: 14px;
      overflow: auto;
      background: #050505;
      border: 1px solid #262626;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>Cloud Notes</h1>

  <section class="panel">
    <h2>Create note</h2>
    <input id="create-title" placeholder="title">
    <textarea id="create-content" placeholder="content"></textarea>
    <button id="create-note">Create</button>
  </section>

  <section class="panel">
    <h2>Get all notes</h2>
    <button id="list-notes">List notes</button>
  </section>

  <section class="panel">
    <h2>Get one note</h2>
    <input id="get-note-id" placeholder="note id">
    <button id="get-note">Get note</button>
  </section>

  <section class="panel">
    <h2>Update note</h2>
    <input id="update-note-id" placeholder="note id">
    <input id="update-title" placeholder="new title">
    <textarea id="update-content" placeholder="new content"></textarea>
    <button id="update-note">Update note</button>
  </section>

  <section class="panel">
    <h2>Delete note</h2>
    <input id="delete-note-id" placeholder="note id">
    <button id="delete-note">Delete note</button>
  </section>

  <section class="panel">
    <h2>Upload file</h2>
    <input id="file" type="file">
    <button id="upload-file">Upload file</button>
  </section>

  <section class="panel">
    <h2>Get files</h2>
    <button id="list-files">List files</button>
  </section>

  <section class="panel">
    <h2>View file</h2>
    <input id="view-file-key" placeholder="file key">
    <button id="view-file">View file</button>
  </section>

  <section class="panel">
    <h2>Output</h2>
    <pre id="output"></pre>
  </section>

  <script src="/app.js"></script>
</body>
</html>
